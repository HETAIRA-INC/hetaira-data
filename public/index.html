<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HETAIRA.EROS // EROTIC AUDIO DB</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #070408;
      --card-bg: rgba(18, 10, 19, 0.88);
      --card-border: rgba(255, 0, 85, 0.28);
      --neon-pink: #ff007f;
      --crimson-lust: #ff003c;
      --blush-glow: #ff4d8d;
      --cyber-cyan: #00f0ff;
      --gold-tier: #fcee0a;
      --text-main: #f8fafc;
      --text-muted: #b89ca9;
      --font-display: 'Orbitron', monospace, sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 0, 85, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--blush-glow);
      text-transform: uppercase;
      background: rgba(255, 0, 85, 0.08);
      border: 1px solid rgba(255, 0, 85, 0.35);
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .heartbeat-icon {
      width: 10px;
      height: 10px;
      background-color: var(--crimson-lust);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--crimson-lust);
      animation: heartbeat 1.2s infinite;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      margin-bottom: 0.5rem;
    }

    h1 span { color: var(--neon-pink); }

    .filter-bar {
      background: rgba(18, 10, 19, 0.9);
      border: 1px solid rgba(255, 0, 85, 0.3);
      padding: 1.2rem 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }

    .search-input-wrap {
      flex: 1 1 280px;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    .filter-dropdowns {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .cyber-select {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: var(--blush-glow);
      font-family: var(--font-display);
      font-size: 0.75rem;
      padding: 0.75rem 1rem;
      outline: none;
      cursor: pointer;
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--cyber-cyan);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.8rem;
    }

    .cyber-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
      transition: transform 0.3s ease, border-color 0.3s ease;
      overflow: hidden;
    }

    .cyber-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-pink);
      box-shadow: 0 10px 30px -8px rgba(255, 0, 85, 0.45);
    }

    .card-cover-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #120914;
    }

    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .floating-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-tier {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--gold-tier);
      color: var(--gold-tier);
    }

    .badge-tier.free {
      border-color: var(--cyber-cyan);
      color: var(--cyber-cyan);
    }

    .badge-audience {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      background: rgba(255, 0, 85, 0.85);
      color: #fff;
    }

    .card-body {
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-display);
      font-size: 0.72rem;
      margin-bottom: 0.5rem;
    }

    .card-id { color: var(--blush-glow); font-weight: 700; }
    .card-tag { color: var(--cyber-cyan); }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .card-credits {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }
    .card-credits span { color: var(--blush-glow); }

    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 1rem;
    }

    .tag-pill {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 2px 6px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--cyber-cyan);
    }

    .cyber-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem;
      margin-top: auto;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-pink);
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      transition: all 0.2s ease;
    }

    .cyber-btn:hover {
      background: linear-gradient(90deg, var(--crimson-lust), var(--neon-pink));
      box-shadow: 0 0 15px var(--neon-pink);
    }

    #scrollTrigger {
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      color: var(--blush-glow);
      margin-top: 2rem;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%, 45% { transform: scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!--<header>
      <div class="status-badge">
        <span class="heartbeat-icon"></span>
        STREAM ENGINE OPTIMIZED // CDN LINK ACTIVE
      </div>
      <h1>HETAIRA<span>.EROS</span></h1>
    </header>-->

    <div class="filter-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH PROTOCOLS, TAGS, CREATORS...">
      </div>
      <div class="filter-dropdowns">
        <select id="audienceFilter" class="cyber-select">
          <option value="ALL">AUDIENCE: ALL</option>
          <option value="F4M">F4M</option>
          <option value="M4F">M4F</option>
          <option value="F4F">F4F</option>
          <option value="M4M">M4M</option>
          <option value="ANY">ANY</option>
        </select>

        <select id="tierFilter" class="cyber-select">
          <option value="ALL">TIER: ALL</option>
          <option value="FREE">FREE</option>
          <option value="PAID">PAID</option>
        </select>
      </div>
      <div class="count-indicator" id="resultsCount">// LOADED: 0 RECORDS</div>
    </div>

    <main class="cards-grid" id="cardsGrid"></main>
    <div id="scrollTrigger">// SCROLL FOR MORE PROTOCOLS...</div>
  </div>

  <script>
    let masterList = [];
    let filteredList = [];
    let displayedCount = 0;
    const PAGE_SIZE = window.APP_CONFIG?.PAGE_SIZE || 12;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Try to fetch lightweight summary index first, fallback to data.json
        let res = await fetch(window.APP_CONFIG.SUMMARY_JSON);
        if (!res.ok) res = await fetch(window.APP_CONFIG.FALLBACK_DATA_JSON);
        
        masterList = await res.json();
        
        document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 200));
        document.getElementById('audienceFilter').addEventListener('change', applyFilters);
        document.getElementById('tierFilter').addEventListener('change', applyFilters);

        applyFilters();
        setupInfiniteScroll();
      } catch (err) {
        console.error(err);
        document.getElementById('cardsGrid').innerHTML = `
          <div style="grid-column:1/-1; color:var(--crimson-lust); text-align:center; padding:3rem;">
            CRITICAL TELEMETRY READ ERROR: Unable to load records catalog.
          </div>`;
      }
    });

    function debounce(fn, ms) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), ms);
      };
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const audience = document.getElementById('audienceFilter').value;
      const tier = document.getElementById('tierFilter').value;

      filteredList = masterList.filter(item => {
        if (item.status && item.status !== 'ACTIVE') return false;

        const tagsStr = Array.isArray(item.tags) ? item.tags.join(' ').toLowerCase() : '';
        const matchSearch = !search || 
          (item.title && item.title.toLowerCase().includes(search)) ||
          (item.artist && item.artist.toLowerCase().includes(search)) ||
          (item.author && item.author.toLowerCase().includes(search)) ||
          (item.id && item.id.toLowerCase().includes(search)) ||
          tagsStr.includes(search);

        const matchAudience = audience === 'ALL' || (item.audience && item.audience.toUpperCase() === audience);
        const isFree = (item.tier || '').toUpperCase().includes('FREE');
        const matchTier = tier === 'ALL' || (tier === 'FREE' && isFree) || (tier === 'PAID' && !isFree);

        return matchSearch && matchAudience && matchTier;
      });

      document.getElementById('resultsCount').textContent = `// MATCHED: ${filteredList.length} PROTOCOLS`;
      
      // Reset Grid
      document.getElementById('cardsGrid').innerHTML = '';
      displayedCount = 0;
      appendNextBatch();
    }

    function appendNextBatch() {
      const grid = document.getElementById('cardsGrid');
      const trigger = document.getElementById('scrollTrigger');

      if (displayedCount >= filteredList.length) {
        trigger.textContent = filteredList.length > 0 ? '// END OF ARCHIVE RECORDS' : '// NO MATCHING PROTOCOLS';
        return;
      }

      const nextSlice = filteredList.slice(displayedCount, displayedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      const resolveFn = window.resolveAssetUrl || (url => url);
      const FALLBACK_ART = resolveFn('covers/fallback_cover.png', 'cover');


      nextSlice.forEach(item => {
        const isFree = (item.tier || '').toUpperCase().includes('FREE');
        const tags = Array.isArray(item.tags) ? item.tags.slice(0, 3) : [];
        const rawCover = item.cover ? window.resolveAssetUrl(item.cover, 'cover') : '';
        const initialSrc = rawCover || FALLBACK_ART;

        const card = document.createElement('article');
        card.className = 'cyber-card';
        card.innerHTML = `
          <div class="card-cover-wrapper">
            <img src="${initialSrc}" 
                 alt="${item.title || 'Cover'}" 
                 class="card-cover" 
                 loading="lazy" 
                 onerror="this.onerror=null; this.src='${FALLBACK_ART}';">
            <div class="floating-badges">
              <span class="badge-tier ${isFree ? 'free' : ''}">${item.tier || 'FREE'}</span>
              <span class="badge-audience">${item.audience || 'F4M'}</span>
            </div>
          </div>

          <div class="card-body">
            <div class="card-meta">
              <span class="card-id">${item.id || 'EROS'}</span>
              <span class="card-tag">${item.tag || 'AUDIO'}</span>
            </div>
            
            <h2 class="card-title">${item.title || 'Untitled'}</h2>
            <div class="card-credits">By <span>${item.author || 'Anonymous'}</span></div>

            ${tags.length ? `
              <div class="pills-container">
                ${tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
              </div>` : ''}

            <a href="detail.html?id=${item.uuid || item.id}" class="cyber-btn">
              ENGAGE FEED &rarr;
            </a>
          </div>
        `;
        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      displayedCount += nextSlice.length;

      trigger.textContent = displayedCount >= filteredList.length ? '// END OF ARCHIVE RECORDS' : '// SCROLL FOR MORE PROTOCOLS...';
    }

    function setupInfiniteScroll() {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {
          appendNextBatch();
        }
      }, { rootMargin: '200px' });

      observer.observe(document.getElementById('scrollTrigger'));
    }
  </script>
</body>
</html>
